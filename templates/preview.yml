# Pull request previews on Cloudflare Pages. The job is TimZander/ci-recipes'
# pages-preview.yml, pinned to one commit; this file holds only the triggers, the build and
# the secrets. Written by /ci:init; move the pin with /ci:update. See ci-recipes' STANDARD.md.
#
# The preview never waits for the tests: a red test must not block UAT.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # A pull request that changes only these runs no preview: none of them is built into the
    # site (STANDARD.md rule 6, decision 0007). Remove docs/ if docs/ is the site, and add
    # paths the build never reads. Never add a paths: key beside this one.
    paths-ignore:
      - 'openspec/**'
      - 'docs/**'
      - '*.md'

jobs:
  preview:
    # The job (pages-preview.yml) skips a fork's pull request itself.
    permissions:
      contents: read
      pull-requests: write
    uses: TimZander/ci-recipes/.github/workflows/pages-preview.yml@__SHA__
    with:
      project-name: __PROJECT__
      directory: dist
      wrangler-version: '__WRANGLER__'
      node-version: '22'
      build-command: npm ci && npm run build
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
