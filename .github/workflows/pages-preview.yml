# Reusable: a pull request's Cloudflare Pages preview, built by the caller's build command and
# deployed as pr-<number>, with its one comment (STANDARD.md, rules 1-3).
#
# A caller references this whole job, pinned to a commit SHA:
#
#   jobs:
#     preview:
#       uses: TimZander/ci-recipes/.github/workflows/pages-preview.yml@<sha>
#       with: { project-name: ..., directory: dist, wrangler-version: '4.142.0', build-command: npm ci && npm run build }
#       secrets: { CLOUDFLARE_API_TOKEN: ..., CLOUDFLARE_ACCOUNT_ID: ... }
#
# The caller keeps only its triggers, its build and its secrets. Everything else (concurrency,
# the fork guard, permissions, the deploy and the comment) lives here, once.
name: Pages preview

on:
  workflow_call:
    inputs:
      project-name:
        description: The Cloudflare Pages project.
        type: string
        required: true
      directory:
        description: >-
          The built output to deploy, relative to working-directory. Never `.`: the job checks
          ci-recipes out into `.ci-recipes/`, which would be published with it.
        type: string
        required: true
      working-directory:
        description: >-
          Where the build command and wrangler run. Keep it the folder that holds a Pages
          functions/ directory, if the project has one.
        type: string
        default: .
      wrangler-version:
        description: An exact wrangler version, never a range.
        type: string
        required: true
      build-command:
        description: A bash command that builds the site into directory, run in working-directory.
        type: string
        required: true
      node-version:
        description: Set up this Node.js first, with npm caching. Empty for none.
        type: string
        default: ''
      node-cache:
        description: setup-node's package-manager cache (npm, yarn or pnpm); empty for none.
        type: string
        default: npm
      cache-dependency-path:
        description: The lockfile the cache keys on, relative to the repository root.
        type: string
        default: package-lock.json
      python-version:
        description: >-
          Set up uv and this Python first (astral-sh/setup-uv, its cache keyed on uv.lock), for a
          build that runs `uv run`. Empty for none.
        type: string
        default: ''
      cache-path:
        description: >-
          Files the build downloads and can reuse, one path per line, relative to the repository
          root: restored before the build and saved when the job ends (actions/cache). Empty for
          none. Set it together with cache-key.
        type: string
        default: ''
      cache-key:
        description: >-
          The cache's key. Change it whenever what cache-path holds should change, such as a
          pinned model or runtime version.
        type: string
        default: ''
      note:
        description: An optional line for the comment.
        type: string
        default: ''
      timeout-minutes:
        description: The job's limit, build included.
        type: number
        default: 10
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  preview:
    # Forks get no secrets; skipping here bills no minute. Any event but pull_request still runs,
    # so the first step can say what is wrong instead of a silent skip.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # One preview per PR; a newer push cancels the run in progress. A close's teardown joins this
    # group too (pages-teardown.yml), cancelling a build that would otherwise deploy after it.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Refuse a call this workflow cannot serve
        env:
          EVENT: ${{ github.event_name }}
          DIRECTORY: ${{ inputs.directory }}
          WORKDIR: ${{ inputs.working-directory }}
          CACHE_PATH: ${{ inputs.cache-path }}
          CACHE_KEY: ${{ inputs.cache-key }}
        run: |
          set -euo pipefail
          [ "$EVENT" = pull_request ] || { echo "::error::pages-preview.yml is called on pull_request only, not $EVENT (a preview from any other event could reach production)"; exit 1; }
          case "$DIRECTORY" in .|./|""|.ci-recipes*|./.ci-recipes*|/*|..|../*|*/..|*/../*) echo "::error::directory '$DIRECTORY' would publish the whole checkout, ci-recipes itself or something outside working-directory"; exit 1 ;; esac
          case "$WORKDIR" in /*|..|../*|*/..|*/../*) echo "::error::working-directory '$WORKDIR' is outside the checkout"; exit 1 ;; esac
          if { [ -n "$CACHE_PATH" ] && [ -z "$CACHE_KEY" ]; } || { [ -z "$CACHE_PATH" ] && [ -n "$CACHE_KEY" ]; }; then echo "::error::cache-path and cache-key are set together or not at all"; exit 1; fi

      # The PR's head commit, not the merge with the base the default checkout builds: the
      # preview and its comment then name the same commit.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - if: inputs.node-version != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.node-cache }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - if: inputs.python-version != ''
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ inputs.python-version }}

      # The caller's downloads (cache-path), restored before the build and saved when the job
      # ends. A run reads the default branch's cache, and saves only into its own branch's or pull
      # request's scope, so nothing it builds can change what the default branch restores.
      - if: inputs.cache-path != ''
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

      # The PR's own code and its dependencies run here, so nothing of ci-recipes is on disk yet:
      # it is checked out, and checked, only after the build, right before it runs with the token.
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      # PINNED-CHECKOUT: identical in pages-preview.yml, pages-branch-preview.yml and
      # pages-teardown.yml (a test compares them). The actions run at exactly the commit the caller pinned: job.workflow_sha names
      # the commit of the workflow defining this job (ci-recipes'), where github.workflow_sha
      # would name the caller's. Refuses an empty or non-SHA value, another commit, or a tree
      # that differs from that commit.
      - name: Check out ci-recipes at this workflow's commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: TimZander/ci-recipes
          ref: ${{ job.workflow_sha }}
          path: .ci-recipes
          persist-credentials: false
      - name: Refuse anything but the pinned commit
        env:
          WANT: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WANT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is '$WANT', not a commit SHA"; exit 1; }
          got=$(git -C .ci-recipes rev-parse HEAD)
          [ "$got" = "$WANT" ] || { echo "::error::ci-recipes checked out at $got, not $WANT"; exit 1; }
          [ -z "$(git -C .ci-recipes status --porcelain --ignored)" ] || { echo "::error::ci-recipes' tree differs from $WANT"; exit 1; }
      # END PINNED-CHECKOUT

      - uses: ./.ci-recipes/actions/pages-preview
        with:
          project-name: ${{ inputs.project-name }}
          directory: ${{ inputs.directory }}
          working-directory: ${{ inputs.working-directory }}
          wrangler-version: ${{ inputs.wrangler-version }}
          note: ${{ inputs.note }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
